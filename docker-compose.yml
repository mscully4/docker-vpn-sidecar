services:
  vpn:
    image: qmcgaw/gluetun:v3
    container_name: vpn-sidecar
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${PROTONVPN_SERVER_COUNTRIES}
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      DOT: "on"
      # Uncomment and adjust if the app needs to reach local network resources:
      # FIREWALL_OUTBOUND_SUBNETS: 192.168.0.0/16,172.16.0.0/12
    ports: []
      # Declare any ports your app needs here, e.g.:
      # - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/vpn/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build: ./app
    container_name: vpn-app
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped
